<!DOCTYPE html>
<!--sperrmuell:verschluesselt-->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sperrmuell Karlsruhe &middot; gesperrt</title>
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<style>
:root{
  --ink:#16150F; --paper:#E7E5DE; --panel:#EFEEE9;
  --signal:#F6C500; --today:#CF3520; --line:#CBC8BE; --muted:#726F67;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--ink);color:var(--paper);
  font:16px/1.45 var(--sans);-webkit-font-smoothing:antialiased;
  display:flex;align-items:center;justify-content:center;padding:24px;
}
.gate{width:100%;max-width:420px}

/* Jahresband wie auf der Karte, hier nur als Motiv */
.band{display:flex;align-items:flex-end;gap:0;height:26px;margin-bottom:22px}
.band i{flex:1 1 auto;height:6px;background:#2D2B24}
.band i.has{height:15px;background:var(--signal)}
.band i.now{height:22px;background:var(--today)}

h1{margin:0;font-size:22px;line-height:1;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
h1 b{color:var(--signal)}
h1 span{display:block;font:600 10px/1 var(--sans);letter-spacing:.3em;color:var(--muted);margin-top:7px}
p{margin:18px 0 0;font-size:14px;color:#B6B2A6}

form{margin:22px 0 0}
label{display:block;font:600 10px/1 var(--sans);letter-spacing:.22em;
      text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.field{display:flex;gap:0}
input[type=password],input[type=text]{
  flex:1 1 auto;min-width:0;font:15px/1 var(--mono);letter-spacing:.08em;
  padding:14px 13px;color:var(--ink);background:var(--paper);
  border:1px solid var(--paper);border-right:0;border-radius:0;
}
input:focus{outline:2px solid var(--signal);outline-offset:-2px}
.peek{
  flex:0 0 auto;font:600 11px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;
  background:var(--paper);color:var(--muted);border:1px solid var(--paper);border-left:1px solid var(--line);
  padding:0 13px;cursor:pointer;border-radius:0;
}
.peek:hover{color:var(--ink)}
button.go{
  width:100%;margin-top:12px;font:700 13px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;
  background:var(--signal);color:var(--ink);border:2px solid var(--signal);
  padding:15px;cursor:pointer;border-radius:0;
}
button.go:hover{background:var(--ink);color:var(--signal)}
button.go:disabled{background:#2D2B24;border-color:#3A382F;color:var(--muted);cursor:default}
.keep{display:flex;align-items:center;gap:9px;margin-top:14px;font-size:13px;color:#B6B2A6}
.keep input{width:16px;height:16px}
.msg{margin-top:16px;font:600 13px/1.4 var(--mono);min-height:19px}
.msg.bad{color:var(--today)}
.msg.busy{color:var(--signal)}
.foot{margin-top:26px;padding-top:16px;border-top:1px solid #2D2B24;
      font:11px/1.6 var(--mono);color:#6A675E;letter-spacing:.03em}
</style>
</head>
<body>
<div class="gate">
  <div class="band" id="band" aria-hidden="true"></div>
  <h1><b>Sperrm&uuml;ll</b> Karlsruhe<span>Gesperrt</span></h1>
  <p>Die Termine liegen verschl&uuml;sselt in dieser Datei. Ohne Masterpasswort
     ist hier nichts zu holen, auch nicht im Quelltext.</p>
  <form id="form" autocomplete="off">
    <label for="pw">Masterpasswort</label>
    <div class="field">
      <input id="pw" type="password" autocomplete="current-password"
             spellcheck="false" autofocus placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;">
      <button class="peek" id="peek" type="button" title="Passwort anzeigen">zeigen</button>
    </div>
    <button class="go" id="go" type="submit">Karte &ouml;ffnen</button>
    <div class="keep"><input type="checkbox" id="keep">
      <span>Auf diesem Ger&auml;t merken</span></div>
  </form>
  <div class="msg" id="msg" role="status" aria-live="polite"></div>
  <div class="foot">Stand 2026-09-07 &middot; AES-256-CBC, PBKDF2-SHA256</div>
</div>

var KEY = "sperrmuell-pw:" + CRYPT.salt.slice(0, 12);

var form = document.getElementById("form");
var pw = document.getElementById("pw");
var go = document.getElementById("go");
var msg = document.getElementById("msg");
var keep = document.getElementById("keep");

/* Motiv im Kopf: ein Strich pro Woche, ein paar davon gelb */
(function(){
  var html = "", marks = [3,4,9,14,15,22,29,30,37,44];
  for (var i=0;i<52;i++){
    var cls = i === 26 ? "now" : (marks.indexOf(i) >= 0 ? "has" : "");
    html += '<i class="' + cls + '"></i>';
  }
  document.getElementById("band").innerHTML = html;
})();

document.getElementById("peek").addEventListener("click", function(){
  var shown = pw.type === "text";
  pw.type = shown ? "password" : "text";
  this.textContent = shown ? "zeigen" : "verbergen";
  pw.focus();
});

function say(text, kind){
  msg.textContent = text || "";
  msg.className = "msg" + (kind ? " " + kind : "");
}
function bytes(b64){
  var raw = atob(b64), out = new Uint8Array(raw.length);
  for (var i=0;i<raw.length;i++){ out[i] = raw.charCodeAt(i); }
  return out;
}
function join(parts){
  var total = 0, at = 0;
  parts.forEach(function(p){ total += p.length; });
  var out = new Uint8Array(total);
  parts.forEach(function(p){ out.set(p, at); at += p.length; });
  return out;
}

/* Entschluesseln: PBKDF2 -> 32 Byte AES-Schluessel + 32 Byte HMAC-Schluessel.
   Erst die Pruefsumme, dann AES-CBC. Falsches Passwort faellt bei der
   Pruefsumme durch, ohne dass Muell in die Seite geschrieben wird. */
function decrypt(password){
  var subtle = window.crypto && window.crypto.subtle;
  if (!subtle){
    return Promise.reject(new Error("Browser gibt die Krypto-Schnittstelle nur "
      + "ueber https oder localhost frei. Seite bitte darueber oeffnen."));
  }
  var salt = bytes(CRYPT.salt), iv = bytes(CRYPT.iv);
  var tag = bytes(CRYPT.tag), data = bytes(CRYPT.data);
  var raw = new TextEncoder().encode(password);
  return subtle.importKey("raw", raw, "PBKDF2", false, ["deriveBits"])
    .then(function(base){
      return subtle.deriveBits({
        name:"PBKDF2", salt:salt, iterations:CRYPT.iterations, hash:"SHA-256"
      }, base, 512);
    })
    .then(function(bits){
      var all = new Uint8Array(bits);
      var keyEnc = all.slice(0, 32), keyMac = all.slice(32, 64);
      return subtle.importKey("raw", keyMac, { name:"HMAC", hash:"SHA-256" },
                              false, ["verify"])
        .then(function(macKey){
          return subtle.verify("HMAC", macKey, tag, join([salt, iv, data]));
        })
        .then(function(ok){
          if (!ok) throw new Error("Falsches Passwort.");
          return subtle.importKey("raw", keyEnc, { name:"AES-CBC" }, false, ["decrypt"]);
        })
        .then(function(aesKey){
          return subtle.decrypt({ name:"AES-CBC", iv:iv }, aesKey, data);
        })
        .then(function(plain){ return new TextDecoder("utf-8").decode(plain); });
    });
}

function show(html){
  document.open();
  document.write(html);
  document.close();
}

function unlock(password, quiet){
  go.disabled = true;
  say("entsperren \u2026", "busy");
  return decrypt(password).then(function(html){
    if (keep.checked){ try { localStorage.setItem(KEY, password); } catch (e) {} }
    show(html);
  }).catch(function(err){
    try { localStorage.removeItem(KEY); } catch (e) {}
    go.disabled = false;
    if (quiet){ say(""); return; }
    say(err.message || "Das hat nicht geklappt.", "bad");
    pw.select();
  });
}

form.addEventListener("submit", function(ev){
  ev.preventDefault();
  var value = pw.value;
  if (!value){ say("Bitte das Masterpasswort eingeben.", "bad"); return; }
  unlock(value, false);
});

/* Gemerktes Passwort: direkt versuchen, still scheitern */
(function(){
  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (saved){ keep.checked = true; pw.value = saved; unlock(saved, true); }
})();
